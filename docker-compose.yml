services:
  postgres:
    image: postgres:15-alpine
    container_name: property_postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-property_db}
      POSTGRES_USER: ${POSTGRES_USER:-property_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-property_pass}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - property_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-property_user} -d ${POSTGRES_DB:-property_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: property_api
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-8080}
    ports:
      - "${API_PORT:-8000}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - property_network
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  # Optional: PgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: property_pgadmin
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres
    networks:
      - property_network
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    profiles:
      - tools

  importer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: property_importer
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - property_network
    command: >
      python -u ./src/import_properties_from_json.py
    restart: "no"
    profiles:
      - tools


volumes:
  postgres_data:
  pgadmin_data:

networks:
  property_network:
    driver: bridge